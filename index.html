<style>
/* Layout: one-column phone app — sticky trip header, scrolling day-grouped feed, bottom tab bar, floating add button, bottom-sheet forms. */
:root {
  --bg: #FFF6F8;        /* blush paper */
  --card: #FFFFFF;
  --ink: #3B2A33;       /* plum ink */
  --muted: #8E7482;
  --line: #F1DCE4;
  --rose: #E5638E;      /* lotus pink accent */
  --rose-soft: #FCE3EC;
  --mango: #F2A93B;     /* Thai mango */
  --mango-soft: #FDEBD0;
  --leaf: #4F9A7A;      /* Vietnamese leaf green */
  --leaf-soft: #DDF0E6;
  --lav: #8C7BD6;
  --lav-soft: #ECE8FB;
  --shadow: 0 6px 22px rgba(120, 50, 80, .10);
  --display: "Fredoka", "Nunito Sans", ui-rounded, system-ui, sans-serif;
  --body: "Nunito Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "DM Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #1E1519; --card: #2A1E24; --ink: #F7E9EF; --muted: #BFA3B1; --line: #3D2C35;
    --rose: #F37CA2; --rose-soft: #4A2433; --mango: #F5B95A; --mango-soft: #43321A;
    --leaf: #6FC29C; --leaf-soft: #1E3A2E; --lav: #A797EC; --lav-soft: #2E2849;
    --shadow: 0 6px 22px rgba(0, 0, 0, .35); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #1E1519; --card: #2A1E24; --ink: #F7E9EF; --muted: #BFA3B1; --line: #3D2C35;
  --rose: #F37CA2; --rose-soft: #4A2433; --mango: #F5B95A; --mango-soft: #43321A;
  --leaf: #6FC29C; --leaf-soft: #1E3A2E; --lav: #A797EC; --lav-soft: #2E2849;
  --shadow: 0 6px 22px rgba(0, 0, 0, .35); color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { min-height: 100%; }
body { background: var(--bg); color: var(--ink); font: 15px/1.45 var(--body); -webkit-tap-highlight-color: transparent; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--bg); }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2.5px solid var(--rose); outline-offset: 2px; }
.wrap { max-width: 560px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 0 140px; }
.num { font-family: var(--mono); font-variant-numeric: tabular-nums; letter-spacing: -.01em; }

/* header */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--bg); padding-block: 14px 10px; }
.brand { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.brand h1 { font: 600 1.45rem/1.1 var(--display); margin: 0; letter-spacing: -.01em; text-wrap: balance; }
.brand h1 span { color: var(--rose); }
.route { font-size: .8rem; color: var(--muted); margin-top: 3px; display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.route b { color: var(--ink); font-weight: 700; }
.daypill { font: 600 .78rem var(--display); background: var(--rose-soft); color: var(--rose); padding: 6px 11px; border-radius: 999px; white-space: nowrap; }
.filters { display: flex; gap: 6px; margin-top: 12px; overflow-x: auto; scrollbar-width: none; }
.filters::-webkit-scrollbar { display: none; }
.chip { border: 1.5px solid var(--line); background: var(--card); border-radius: 999px; padding: 6px 12px; font-size: .82rem; font-weight: 700; white-space: nowrap; color: var(--muted); }
.chip[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: var(--bg); }

/* summary strip */
.strip { display: grid; grid-template-columns: 1.3fr 1fr; gap: 10px; margin: 6px 0 18px; }
.tile { background: var(--card); border-radius: 18px; padding: 13px 14px; box-shadow: var(--shadow); min-width: 0; }
.tile .lbl { font-size: .7rem; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); font-weight: 700; }
.tile .big { font-size: 1.45rem; font-weight: 500; margin-top: 2px; }
.tile .sub { font-size: .78rem; color: var(--muted); }
.tile.hero { background: linear-gradient(140deg, var(--rose) 0%, #F08AA8 100%); color: #fff; }
.tile.hero .lbl, .tile.hero .sub { color: rgba(255,255,255,.85); }

/* feed */
.day { margin-top: 18px; }
.dayhead { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; padding: 0 4px 8px; }
.dayhead h2 { font: 600 1rem var(--display); margin: 0; }
.dayhead .flag { font-size: .72rem; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; padding: 2px 8px; border-radius: 6px; margin-left: 6px; vertical-align: 2px; }
.flag.vn { background: var(--leaf-soft); color: var(--leaf); }
.flag.th { background: var(--mango-soft); color: #B3741A; }
.flag.ph { background: var(--lav-soft); color: var(--lav); }
:root[data-theme="dark"] .flag.th { color: var(--mango); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .flag.th { color: var(--mango); } }
.dayhead .tot { font-size: .85rem; color: var(--muted); }
.list { background: var(--card); border-radius: 20px; box-shadow: var(--shadow); overflow: hidden; }
.item { display: grid; grid-template-columns: 44px minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 12px 14px; border: 0; background: none; width: 100%; text-align: left; border-bottom: 1px solid var(--line); }
.item:last-child { border-bottom: 0; }
.item:hover { background: var(--rose-soft); }
.ico { width: 44px; height: 44px; border-radius: 14px; display: grid; place-items: center; font-size: 1.25rem; background: var(--rose-soft); overflow: hidden; }
.ico img { width: 100%; height: 100%; object-fit: cover; }
.item .t { font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.item .m { font-size: .78rem; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.item .amt { text-align: right; }
.item .amt .p { font-size: .98rem; }
.item .amt .l { font-size: .72rem; color: var(--muted); }
.pcount { font-size: .7rem; font-weight: 800; color: var(--rose); }
.due { display: inline-block; font-size: .66rem; font-weight: 800; letter-spacing: .04em; text-transform: uppercase; padding: 2px 7px; border-radius: 6px;
  background: var(--mango-soft); color: #A8660E; vertical-align: 1px; }
:root[data-theme="dark"] .due { color: var(--mango); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .due { color: var(--mango); } }
.item.unpaid .p { color: #A8660E; }
:root[data-theme="dark"] .item.unpaid .p { color: var(--mango); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .item.unpaid .p { color: var(--mango); } }
.who-switch { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin: 8px 0 12px; }
.who-switch button { border: 2px solid var(--line); background: var(--card); border-radius: 18px; padding: 10px; display: flex; align-items: center; gap: 10px; font: 600 1rem var(--display); color: var(--ink); }
.who-switch button[aria-pressed="true"].jonna { border-color: var(--rose); background: var(--rose-soft); }
.who-switch button[aria-pressed="true"].migs { border-color: #5B8FD9; background: color-mix(in srgb, #5B8FD9 16%, var(--card)); }
.who-switch .av { width: 34px; height: 34px; font-size: 1rem; }
.shopcard { border-radius: 22px; padding: 16px; box-shadow: var(--shadow); color: #fff; }
.shopcard.jonna { background: linear-gradient(140deg, var(--rose), #F3A0BC); }
.shopcard.migs { background: linear-gradient(140deg, #5B8FD9, #8DB5EC); }
.shopcard .lbl { font-size: .72rem; text-transform: uppercase; letter-spacing: .08em; font-weight: 800; opacity: .9; }
.shopcard .big { font-size: 1.7rem; font-weight: 500; }
.shopcard .meter { height: 9px; border-radius: 99px; background: rgba(255,255,255,.35); overflow: hidden; margin: 10px 0 6px; }
.shopcard .meter b { display: block; height: 100%; background: #fff; border-radius: 99px; }
.shopcard .row { display: flex; justify-content: space-between; gap: 10px; font-size: .82rem; font-weight: 700; }
.budgetrow { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px; margin-top: 12px; }
.budgetrow .inp { background: rgba(255,255,255,.92); color: #2B1B23; border: 0; }
.budgetrow .btn { background: rgba(255,255,255,.25); color: #fff; padding: 10px 14px; }
.addshop { width: 100%; margin-top: 12px; border: 2px dashed var(--line); background: var(--card); color: var(--ink); border-radius: 18px; padding: 13px; font: 600 1rem var(--display); }
.prog { background: var(--card); border-radius: 22px; box-shadow: var(--shadow); padding: 16px; margin-top: 8px; }
.prog .big { font: 600 1.35rem var(--display); }
.prog .meter { height: 10px; border-radius: 99px; background: var(--line); overflow: hidden; margin-top: 10px; }
.prog .meter b { display: block; height: 100%; border-radius: 99px; background: linear-gradient(90deg, var(--rose), var(--mango)); }
.phase { display: flex; gap: 6px; margin: 14px 0 10px; }
.phase .chip { flex: 1; text-align: center; padding: 9px 10px; }
.newrem { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px; margin-bottom: 10px; }
.newrem .btn { padding: 11px 16px; background: var(--rose); color: #fff; }
.rem { display: grid; grid-template-columns: 40px minmax(0, 1fr) auto auto; gap: 10px; align-items: center; padding: 11px 14px; border-bottom: 1px solid var(--line); }
.rem:last-child { border-bottom: 0; }
.tick { width: 30px; height: 30px; border-radius: 50%; border: 2.5px solid var(--rose); background: var(--card); display: grid; place-items: center; font-size: .95rem; color: #fff; padding: 0; }
.rem.done .tick { background: var(--leaf); border-color: var(--leaf); }
.rem .rt { border: 0; background: none; text-align: left; padding: 0; font-weight: 700; min-width: 0; overflow-wrap: anywhere; }
.rem.done .rt { text-decoration: line-through; color: var(--muted); font-weight: 600; }
.rem .rs2 { font-size: .74rem; color: var(--muted); font-weight: 600; }
.rem .logx { border: 1.5px solid var(--line); background: var(--card); border-radius: 999px; padding: 5px 10px; font-size: .74rem; font-weight: 800; color: var(--rose); white-space: nowrap; }
.whochip { border: 1.5px solid var(--line); background: var(--card); border-radius: 999px; padding: 3px 9px 3px 3px; display: flex; align-items: center; gap: 5px;
  font-size: .74rem; font-weight: 800; color: var(--ink); white-space: nowrap; }
.whochip .av { width: 22px; height: 22px; font-size: .72rem; }
.whochip .av.any { background: var(--line); color: var(--muted); }
.donehead { font-size: .72rem; text-transform: uppercase; letter-spacing: .08em; font-weight: 800; color: var(--muted); margin: 16px 4px 8px; }
.ctabs { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; margin: 8px 0 12px; }
.ctab { border: 2px solid var(--line); background: var(--card); border-radius: 16px; padding: 8px 4px; display: flex; flex-direction: column; align-items: center; gap: 1px;
  font-weight: 800; font-size: .8rem; color: var(--ink); min-width: 0; }
.ctab .f { font-size: 1.25rem; }
.ctab .v { font-family: var(--mono); font-size: .7rem; color: var(--muted); font-weight: 500; }
.ctab[aria-pressed="true"].vn { border-color: var(--leaf); background: var(--leaf-soft); }
.ctab[aria-pressed="true"].th { border-color: var(--mango); background: var(--mango-soft); }
.ctab[aria-pressed="true"].bt { border-color: var(--lav); background: var(--lav-soft); }
.ctab[aria-pressed="true"].all { border-color: var(--rose); background: var(--rose-soft); }
.cats3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.cat3 { border: 2px solid transparent; background: var(--card); border-radius: 18px; padding: 12px 10px; box-shadow: var(--shadow); text-align: left; min-width: 0; color: var(--ink); }
.cat3 .ce { font-size: 1.4rem; }
.cat3 .cl { font-size: .72rem; text-transform: uppercase; letter-spacing: .07em; font-weight: 800; color: var(--muted); margin-top: 2px; }
.cat3 .cv { font-family: var(--mono); font-size: 1.02rem; margin-top: 1px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.cat3 .cn { font-size: .7rem; color: var(--muted); }
.cat3[aria-pressed="true"] { border-color: var(--rose); background: var(--rose-soft); }
.catmore { display: flex; gap: 6px; flex-wrap: wrap; margin: 10px 0 2px; }
.catmore .chip[aria-pressed="true"] { background: var(--rose); border-color: var(--rose); color: #fff; }
.catnote { display: flex; justify-content: space-between; align-items: baseline; padding: 14px 4px 0; }
.catnote h2 { font: 600 1rem var(--display); margin: 0; }
/* cash */
.cashgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.cashbox { background: var(--bg); border-radius: 14px; padding: 10px 12px; min-width: 0; }
.cashbox .cf { font-size: .74rem; font-weight: 800; color: var(--muted); }
.cashbox .cl { font: 500 1.15rem var(--mono); margin-top: 2px; }
.cashbox .cs { font-size: .74rem; color: var(--muted); margin-top: 2px; line-height: 1.5; }
.wdrow { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 10px; padding: 10px 0; border-bottom: 1px dashed var(--line); width: 100%; border-left: 0; border-right: 0; border-top: 0;
  background: none; text-align: left; color: var(--ink); }
.wdrow:last-child { border-bottom: 0; }
.wdrow .wt { font-weight: 700; }
.wdrow .wm { font-size: .76rem; color: var(--muted); }
.paytag { font-size: .7rem; font-weight: 800; color: var(--muted); }
/* itinerary */
.itc { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin: 8px 0 10px; }
.itc button { border: 2px solid var(--line); background: var(--card); border-radius: 18px; padding: 10px 12px; text-align: left; color: var(--ink); display: flex; gap: 10px; align-items: center; min-width: 0; }
.itc button .f { font-size: 1.5rem; }
.itc button b { font: 600 1rem var(--display); display: block; }
.itc button small { color: var(--muted); font-size: .74rem; font-weight: 700; }
.itc button[aria-pressed="true"].vn { border-color: var(--leaf); background: var(--leaf-soft); }
.itc button[aria-pressed="true"].th { border-color: var(--mango); background: var(--mango-soft); }
.days { display: flex; gap: 8px; overflow-x: auto; padding: 2px 2px 10px; scrollbar-width: none; }
.days::-webkit-scrollbar { display: none; }
.dpill { flex: none; border: 2px solid var(--line); background: var(--card); border-radius: 18px; padding: 7px 12px; text-align: center; color: var(--ink); min-width: 62px; }
.dpill .dw { font-size: .68rem; font-weight: 800; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
.dpill .dn { font: 600 1.3rem/1.1 var(--display); }
.dpill .dc { font-size: .66rem; color: var(--muted); font-weight: 700; }
.dpill[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: var(--bg); }
.dpill[aria-pressed="true"] .dw, .dpill[aria-pressed="true"] .dc { color: var(--bg); opacity: .8; }
.dayhero { background: var(--card); border-radius: 22px; box-shadow: var(--shadow); padding: 14px 16px; display: flex; justify-content: space-between; gap: 10px; align-items: center; }
.dayhero h2 { font: 600 1.15rem var(--display); margin: 0; }
.dayhero .sub { font-size: .8rem; color: var(--muted); }
.tl { position: relative; margin-top: 14px; display: flex; flex-direction: column; gap: 10px; }
.tl::before { content: ""; position: absolute; left: 61px; top: 8px; bottom: 8px; width: 2px; background: var(--line); border-radius: 2px; }
.stop { display: grid; grid-template-columns: 54px 16px minmax(0, 1fr); gap: 0 8px; align-items: start; cursor: pointer; }
.stop .tm { text-align: right; padding-top: 12px; }
.stop .tm b { font-family: var(--mono); font-size: .9rem; display: block; }
.stop .tm small { font-family: var(--mono); font-size: .7rem; color: var(--muted); }
.stop .dot { width: 16px; height: 16px; border-radius: 50%; background: var(--card); border: 3px solid var(--rose); margin-top: 15px; position: relative; z-index: 1; }
.stop.done .dot { background: var(--leaf); border-color: var(--leaf); }
.stop .sc { background: var(--card); border-radius: 18px; box-shadow: var(--shadow); padding: 12px 14px; min-width: 0; }
.stop.done .sc { opacity: .6; }
.stop .st { font-weight: 800; display: flex; gap: 6px; align-items: baseline; }
.stop .st span:last-child { min-width: 0; overflow-wrap: anywhere; }
.stop .sp { font-size: .82rem; margin-top: 3px; }
.stop .sp a { color: var(--rose); font-weight: 700; text-decoration: none; }
.stop .sn { font-size: .8rem; color: var(--muted); margin-top: 4px; white-space: pre-wrap; overflow-wrap: anywhere; }
.stop .stags { display: flex; gap: 5px; flex-wrap: wrap; margin-top: 7px; }
.stag { font-size: .68rem; font-weight: 800; padding: 3px 8px; border-radius: 999px; background: var(--bg); color: var(--muted); }
.stag.ok { background: var(--leaf-soft); color: var(--leaf); }
.stag.todo { background: var(--mango-soft); color: #A8660E; }
:root[data-theme="dark"] .stag.todo { color: var(--mango); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .stag.todo { color: var(--mango); } }
.stag.sug { background: var(--lav-soft); color: var(--lav); }
.ittick { border: 0; background: none; font-size: .74rem; font-weight: 800; color: var(--muted); padding: 0; margin-left: auto; }
.owe { display: flex; justify-content: space-between; gap: 10px; padding: 9px 0; border-bottom: 1px dashed var(--line); font-size: .9rem; }
.owe:last-child { border-bottom: 0; }

/* empty + notices */
.empty { text-align: center; padding: 34px 18px; background: var(--card); border-radius: 22px; box-shadow: var(--shadow); margin-top: 8px; }
.empty .art { font-size: 2.6rem; }
.empty h3 { font: 600 1.15rem var(--display); margin: 8px 0 4px; }
.empty p { color: var(--muted); margin: 0 auto; max-width: 34ch; }
.notice { background: var(--mango-soft); border-radius: 14px; padding: 10px 14px; font-size: .85rem; margin-top: 8px; }

/* memories */
.grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; margin-top: 8px; }
.ph { position: relative; aspect-ratio: 1; border-radius: 14px; overflow: hidden; background: var(--rose-soft); border: 0; padding: 0; max-width: 100%; }
.ph img { width: 100%; height: 100%; object-fit: cover; display: block; }
.ph .cap { position: absolute; inset: auto 0 0; padding: 14px 6px 5px; font-size: .68rem; font-weight: 700; color: #fff; background: linear-gradient(transparent, rgba(40,10,25,.65)); text-align: left; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* totals */
.card { background: var(--card); border-radius: 20px; box-shadow: var(--shadow); padding: 16px; margin-top: 12px; }
.card h3 { font: 600 1rem var(--display); margin: 0 0 10px; }
.bar { display: grid; grid-template-columns: 112px minmax(0, 1fr) auto; gap: 10px; align-items: center; margin: 9px 0; font-size: .88rem; }
.bar .track { height: 10px; background: var(--line); border-radius: 999px; overflow: hidden; }
.bar .fill { height: 100%; border-radius: 999px; background: var(--rose); }
.settle { font: 600 1.05rem var(--display); }
.pay { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.pay > div { background: var(--bg); border-radius: 14px; padding: 10px 12px; }
.rates { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.muted { color: var(--muted); }
.small { font-size: .8rem; }

/* tab bar + fab */
.tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 25; background: var(--card); border-top: 1px solid var(--line);
  padding: 8px max(16px, env(safe-area-inset-right, 0px)) calc(8px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
  display: flex; justify-content: center; }
.tabs .in { display: grid; grid-template-columns: repeat(6, 1fr); width: 100%; max-width: 560px; gap: 6px; }
.tab { border: 0; background: none; padding: 6px 1px; min-width: 0; font-size: .68rem !important; white-space: nowrap; border-radius: 12px; font-size: .74rem; font-weight: 700; color: var(--muted); display: flex; flex-direction: column; align-items: center; gap: 1px; }
.tab .e { font-size: 1.25rem; }

<script>/* Offline storage for the phone version: data lives on this phone (localStorage + IndexedDB for photos).
   Mimics the small slice of the hosted app's db / assets / user API the app uses. */
(function () {
  "use strict";
  const KEY = "jm-trip-v1", ME_KEY = "jm-trip-me";
  const listeners = [];
  let store;
  try { store = JSON.parse(localStorage.getItem(KEY) || "null"); } catch { store = null; }
  if (!store) { store = { docs: {}, gone: {} }; for (const [p, d] of Object.entries(window.SEED || {})) store.docs[p] = { ...d, __t: "2026-01-01T00:00:00Z" }; }
  const now = () => new Date().toISOString();
  function save() { try { localStorage.setItem(KEY, JSON.stringify(store)); } catch (e) { alert("Phone storage is full. Remove a few photos, then try again."); throw e; } }
  function clean(d) { const o = { ...d }; delete o.__t; return o; }
  function emit() { for (const l of listeners) { try { l(); } catch { /* listener error */ } } }
  const rid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);

  function docRef(path) {
    return {
      async set(data) { store.docs[path] = { ...data, __t: now() }; delete store.gone[path]; save(); emit(); },
      async update(data) { if (!store.docs[path]) throw Object.assign(new Error("not found"), { code: "not-found" }); store.docs[path] = { ...store.docs[path], ...data, __t: now() }; save(); emit(); },
      async delete() { delete store.docs[path]; store.gone[path] = now(); save(); emit(); },
      onSnapshot(cb) {
        const fire = () => { const d = store.docs[path]; cb({ id: path.split("/").pop(), exists: !!d, data: () => (d ? clean(d) : undefined) }); };
        listeners.push(fire); setTimeout(fire, 0); return () => {};
      }
    };
  }
  function colRef(name) {
    return {
      async add(data) { const id = rid(); await docRef(name + "/" + id).set(data); return { id }; },
      onSnapshot(cb) {
        const fire = () => {
          const docs = Object.entries(store.docs).filter(([p]) => p.startsWith(name + "/") && p.split("/").length === 2)
            .map(([p, d]) => ({ id: p.split("/")[1], exists: true, data: () => clean(d) }));
          cb({ docs });
        };
        listeners.push(fire); setTimeout(fire, 0); return () => {};
      }
    };
  }
  const db = { doc: docRef, collection: colRef };

  /* photos in IndexedDB */
  const URLS = (window.PHOTO_URLS = {});
  function idb() {
    return new Promise((res, rej) => { const r = indexedDB.open("jm-trip-photos", 1); r.onupgradeneeded = () => r.result.createObjectStore("p"); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); });
  }
  async function tx(mode, fn) { const d = await idb(); return new Promise((res, rej) => { const t = d.transaction("p", mode); const out = fn(t.objectStore("p")); t.oncomplete = () => res(out && out.result); t.onerror = () => rej(t.error); }); }
  async function allPhotos() {
    const d = await idb();
    return new Promise((res) => { const out = {}; const r = d.transaction("p").objectStore("p").openCursor(); r.onsuccess = () => { const c = r.result; if (c) { out[c.key] = c.value; c.continue(); } else res(out); }; r.onerror = () => res(out); });
  }
  const assets = {
    async upload(b) { const id = "p" + rid(); await tx("readwrite", (s) => s.put(b, id)); URLS[id] = URL.createObjectURL(b); return { id }; },
    async delete(id) { await tx("readwrite", (s) => s.delete(id)); if (URLS[id]) URL.revokeObjectURL(URLS[id]); delete URLS[id]; }
  };

  const user = {

  async function askWho() {

  const softFail = (e) => { console.warn(e); if (e && e.code === "permission-denied") { try { toast("Sync blocked. Check the Firebase rules."); } catch { /* no toast yet */ } } };
  function newCode() { const a = "abcdefghjkmnpqrstuvwxyz23456789", r = crypto.getRandomValues(new Uint8Array(28)); return "jm-" + Array.from(r, (x) => a[x % a.length]).join(""); }
  function askTrip() {

  function shrink(blob) {
    return new Promise((res, rej) => {
      const img = new Image(), u = URL.createObjectURL(blob);
      img.onload = () => {
        let max = 1280, q = 0.8, out = "";

          const c = document.createElement("canvas"); c.width = Math.round(img.naturalWidth * k); c.height = Math.round(img.naturalHeight * k);
          c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);

          if (out.length < 700000) break;
          max = Math.round(max * 0.8); q = Math.max(0.5, q - 0.08);
        }
        URL.revokeObjectURL(u); res(out);

  async function cloudInit() {
    const base = window.FB_BASE || "https://www.gstatic.com/firebasejs/10.12.2/";
    const A = await import(base + "firebase-app.js"), F = await import(base + "firebase-firestore.js");

    const P = (p) => "trips/" + t.code + "/" + p;

    }
    const cdb = {
      doc(path) {

          async set(d) { F.setDoc(r, d).catch(softFail); },

        };

          onSnapshot(cb, err) { return F.onSnapshot(c, (s) => cb({ docs: s.docs.map((x) => ({ id: x.id, exists: true, data: () => x.data() })) }), err); }

      async upload(blob) { const data = await shrink(blob); const r = F.doc(pcol); URLS[r.id] = data; F.setDoc(r, { data }).catch(softFail); return { id: r.id }; },
      async delete(id) { delete URLS[id]; F.deleteDoc(F.doc(pcol, id)).catch(softFail); }
    };

        if (first) { first = false; clearTimeout(to); res(); } else if (changed) rerender();
      }, () => { clearTimeout(to); res(); });
    });

  }

  let ready = null, API = null;

        }

    },
    switchWho() { localStorage.removeItem(ME_KEY); location.reload(); },
    async exportFile() {
      const photos = {};
      const ph = await allPhotos();
      for (const [k, v] of Object.entries(ph)) photos[k] = await b64(v);
      const payload = JSON.stringify({ app: "jm-trip", v: 1, from: this.who(), at: now(), docs: store.docs, gone: store.gone, photos });
      const stamp = new Date().toISOString().slice(0, 16).replace(/[:T]/g, "-");

      for (const [p, t] of Object.entries(data.gone || {})) {

      const have = await allPhotos();
      for (const [id, url] of Object.entries(data.photos || {})) {
        if (have[id]) continue;
        const blob = await (await fetch(url)).blob();
        await tx("readwrite", (s) => s.put(blob, id)); URLS[id] = URL.createObjectURL(blob);
      }
      save(); emit();
      return changed;
    }
  };
})();

<script>

function readIt() {
  const x = itDraft;
  x.title = $("#it-title").value.trim(); x.date = $("#it-date").value; x.country = $("#it-country").value;
  x.start = $("#it-start").value; x.end = $("#it-end").value; x.place = $("#it-place").value.trim();
  const llv = ($("#it-ll")?.value || "").trim();
  const m = llv.match(/!3d(-?\d+\.\d+)!4d(-?\d+\.\d+)/) || llv.match(/(-?\d{1,2}\.\d{3,})\s*,\s*(-?\d{1,3}\.\d{3,})/);
  if (m) { x.lat = Number(m[1]); x.lng = Number(m[2]); x.geoFor = x.place; x.pinManual = true; }
  else if (x.pinManual) { x.pinManual = false; x.lat = null; x.lng = null; x.geoFor = ""; }
  x.booking = $("#it-booking").value.trim(); x.cost = $("#it-cost").value.replace(/,/g, "").trim(); x.notes = $("#it-notes").value.trim();
}
async function saveIt() {
  readIt();
  const x = itDraft;
  if (!x.title) { toast("Give the stop a name"); $("#it-title").focus(); return; }
  if (x.busy) return;
  x.busy = true;
  try {
    for (let k = 0; k < x.newFiles.length; k++) {
      x.saving = `Uploading photo ${k + 1} of ${x.newFiles.length}…`; drawItSheet();
      const b = await compress(x.newFiles[k].file);
      const r = await S.assets.upload(b, { type: "image/jpeg" });
      x.photos.push(r.id);
    }
    x.newFiles.forEach((f) => URL.revokeObjectURL(f.preview)); x.newFiles = [];
  } catch { x.busy = false; x.saving = ""; drawItSheet(); toast("Couldn't upload a photo. Try again."); return; }
  x.busy = false; x.saving = "";
  for (const id of x.removed) { try { await S.assets.delete(id); } catch { /* already gone */ } }
  const body = { photos: x.photos, country: x.country, date: x.date, start: x.start, end: x.end, type: x.type, title: x.title, place: x.place, notes: x.notes,
    status: x.status || "", booking: x.booking, cost: x.cost ? Number(x.cost) : null, currency: x.currency || "PHP", done: !!x.done,
    suggested: false, createdAt: x.createdAt || new Date().toISOString(), updatedAt: new Date().toISOString(),
    pinManual: !!x.pinManual, ...(x.lat != null && x.geoFor === x.place ? { lat: x.lat, lng: x.lng, geoFor: x.geoFor } : {}) };
  try {
    if (x.id) await S.db.doc("itinerary/" + x.id).set(body); else await S.db.collection("itinerary").add(body);
    S.itCountry = x.country; S.itDay = x.date; itDraft = null; $("#layer").innerHTML = ""; render(); toast(x.id ? "Saved" : "Added to the plan");
  } catch { toast("Couldn't save. Try again."); }
}

function cashCard() {

    const spent = S.expenses.filter((e) => e.method === "Cash" && e.currency === c && !isUnpaid(e)).reduce((a, e) => a + (Number(e.amount) || 0), 0);
    return { out, spent, left: out - spent, n: wd.length };
  };
  const vnd = cur("VND"), thb = cur("THB");
  const fees = S.wd.reduce((a, w) => a + (w.feePhp || 0), 0);
  const box = (flag, c, r) => `<div class="cashbox"><div class="cf">${flag} Cash left</div><div class="cl" style="${r.left < 0 ? "color:#C2405F" : ""}">${esc(local(r.left, c))}</div>
      <div class="cs">Withdrawn ${esc(local(r.out, c))}<br>Spent in cash ${esc(local(r.spent, c))}</div></div>`;
  const rowsW = S.wd.slice().sort((a, b) => (b.date + (b.createdAt || "")).localeCompare(a.date + (a.createdAt || ""))).map((w) => `<button class="wdrow" data-wdopen="${esc(w.id)}">

async function compress(file) {
  const url = URL.createObjectURL(file);
  try {
    const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = url; });
    const max = 1600, sc = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight));
    const c = document.createElement("canvas"); c.width = Math.round(img.naturalWidth * sc); c.height = Math.round(img.naturalHeight * sc);
    c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
    const out = await new Promise((res) => c.toBlob(res, "image/jpeg", 0.85));
    return out || file;
  } catch { return file; } finally { URL.revokeObjectURL(url); }
}

async function save() {
  readForm();
  const x = draft, amt = Number(x.amount);
  if (!amt || amt < 0) { toast("Type the price first"); $("#f-amount").focus(); return; }
  const rates = x.id && x.rates ? x.rates : { ...S.rates };
  const ids = [...x.photos];
  try {
    for (let k = 0; k < x.newFiles.length; k++) {
      x.saving = `Uploading photo ${k + 1} of ${x.newFiles.length}…`; drawSheetKeep();
      const b = await compress(x.newFiles[k].file);
      const r = await S.assets.upload(b, { type: b.type && b.type.startsWith("image/") ? b.type : "image/jpeg" });
      ids.push(r.id);
    }
    x.saving = "Saving…"; drawSheetKeep();
    const me = S.user ? await S.user.id() : null;
    const body = { title: x.title, amount: amt, currency: x.currency, rates, php: Math.round(toPhp(amt, x.currency, rates) * 100) / 100,
      category: x.category, paidBy: x.paidBy, forWhom: x.forWhom, method: x.method || "", status: x.status === "unpaid" ? "unpaid" : "paid", date: x.date, country: x.country || countryFor(x.date), note: x.note,
      photos: ids, createdAt: x.createdAt || new Date().toISOString(), createdBy: x.createdBy || me || null, updatedAt: new Date().toISOString() };
    if (x.id) await S.db.doc("expenses/" + x.id).set(body); else await S.db.collection("expenses").add(body);
    for (const id of x.removed) { try { await S.assets.delete(id); } catch { /* photo already gone */ } }
    closeSheet(); toast(x.id ? "Saved" : "Added 💗");
  } catch (err) {
    x.saving = false; drawSheetKeep();
    const c = err && err.code;
    toast(c === "too_large" ? "That photo is too big (max 20 MB)." : c === "unsupported_type" ? "That file type isn't supported. Use a JPG or PNG photo."
      : c === "quota_or_state" || c === "quota_exceeded" ? "Storage is full. Delete some old photos first." : "Couldn't save. Check your connection and try again.");
  }
}
function drawSheetKeep() { const keep = { a: $("#f-amount")?.value, t: $("#f-title")?.value, n: $("#f-note")?.value }; drawSheet(); if (keep.a != null) { $("#f-amount").value = keep.a; $("#f-title").value = keep.t; $("#f-note").value = keep.n; } }

async function del() {
  const x = draft;
  try {
    await S.db.doc("expenses/" + x.id).delete();
    for (const id of x.photos.concat(x.removed)) { try { await S.assets?.delete(id); } catch { /* already gone */ } }
    closeSheet(); toast("Deleted");
  } catch { toast("Couldn't delete. Try again."); }
}

let viewing = null;
function openViewer(k) { const list = storyList(); if (!list.length) return; viewing = { list, k: Math.max(0, Math.min(k, list.length - 1)), paused: false }; drawViewer(); }
function closeViewer() { viewing = null; $("#layer").innerHTML = ""; }
function step(d) { if (!viewing) return; const k = viewing.k + d; if (k < 0) { viewing.k = 0; drawViewer(); return; } if (k >= viewing.list.length) { closeViewer(); return; } viewing.k = k; drawViewer(); }
function drawViewer() {
  const { list, k } = viewing, p = list[k], e = p.e;
  const bars = list.map((_, i) => `<i class="${i < k ? "done" : i === k ? "now" : ""}"><b></b></i>`).join("");
  const src = blob(esc(p.id));
  $("#layer").innerHTML = `<div class="story${viewing.paused ? " paused" : ""}" id="story" role="dialog" aria-label="Trip stories">
    <div class="stage">
      <div class="bg" style="background-image:url('${src}')"></div>
      <div class="img"><img src="${src}" alt="${esc(e.title)}"></div>
      <div class="shade"></div>
      <div class="head"><div class="bars">${bars}</div>
        <div class="who2"><span class="av ${avCls(e.paidBy)}">${esc(initial(e.paidBy))}</span>
          <span>${esc(PNAME[e.paidBy] || "Us")} <small>· ${esc(fmtDay(e.date))}</small></span>
          ${S.canWrite ? `<button class="editbtn2" data-open="${esc(e.id)}">✏️ Edit</button>` : ""}
          <button class="close" data-vclose aria-label="Close stories">✕</button></div></div>
      <div class="storyday">${esc(e.country === "Vietnam" ? "🇻🇳 Vietnam" : e.country === "Thailand" ? "🇹🇭 Thailand" : "✈️ Before trip")}</div>
      <button class="tapL" data-vprev aria-label="Previous"></button>
      <button class="tapR" data-vnext aria-label="Next"></button>
      <div class="foot"><div class="ttl">${esc(e.title || e.category)}</div>
        <div class="chips2">${isUnpaid(e) ? "<span>⏳ Unpaid</span>" : ""}<span class="num">${peso(e.php)}</span>${e.currency !== "PHP" ? `<span class="num">${esc(local(e.amount, e.currency))}</span>` : ""}<span>${esc(CAT_EMOJI[e.category] || "")} ${esc(e.category)}</span>
          ${e.forWhom && e.forWhom !== "both" ? `<span>for ${esc(PNAME[e.forWhom])}</span>` : ""}</div>
        ${e.note ? `<div class="nt">${esc(e.note)}</div>` : ""}</div>
    </div></div>`;
  const fill = $("#story .bars i.now b");
  fill?.addEventListener("animationend", () => step(1), { once: true });
  const nxt = list[k + 1]; if (nxt) { const im = new Image(); im.src = blob(nxt.id); }
}

let itMap = null;

const geoTried = new Set();
let geoBusy = false;
const BBOX = { Vietnam: "102.1,8.2,109.6,23.4", Thailand: "97.3,5.6,105.7,20.5" };
const CENTER = { Vietnam: [10.776, 106.700], Thailand: [13.746, 100.523] };
function geoQueries(place) {
  const q = new Set();
  const clean = place.replace(/\b\d{5,6}\b/g, "").replace(/,\s*(Vietnam|Viet Nam|Thailand)\s*$/i, "").replace(/\s+/g, " ").trim();
  q.add(clean);
  if (clean.includes("|")) q.add(clean.split("|")[0].trim());
  const parts = clean.split(",").map((t) => t.trim()).filter(Boolean);
  if (parts.length > 1) { q.add(parts[0]); const addr = parts.slice(1).join(", "); if (/\d/.test(addr)) q.add(addr); }
  return [...q].filter((t) => t.length > 2);
}
async function photon(q, country) {
  const [la, lo] = CENTER[country] || CENTER.Vietnam;
  const r = await fetch(`https://photon.komoot.io/api/?limit=1&lang=en&lat=${la}&lon=${lo}&bbox=${BBOX[country] || BBOX.Vietnam}&q=${encodeURIComponent(q)}`);
  if (!r.ok) return null;
  const f = (await r.json()).features?.[0];
  return f ? { lat: f.geometry.coordinates[1], lng: f.geometry.coordinates[0] } : null;
}
async function nominatim(q, country) {
  const r = await fetch(`https://nominatim.openstreetmap.org/search?format=json&limit=1&countrycodes=${country === "Thailand" ? "th" : "vn"}&q=${encodeURIComponent(q + ", " + (IT_PLACES[country] || ""))}`, { headers: { "Accept-Language": "en" } });
  if (!r.ok) return null;
  const j = await r.json();
  return j.length ? { lat: Number(j[0].lat), lng: Number(j[0].lon) } : null;
}
async function geoFill() {
  if (geoBusy || !S.canWrite || !navigator.onLine) return;
  const todo = S.itin.filter((x) => x.place && !x.pinManual && (x.lat == null || x.geoFor !== x.place) && !geoTried.has(x.id + "|" + x.place));
  if (!todo.length) return;
  geoBusy = true;
  for (const x of todo) {
    geoTried.add(x.id + "|" + x.place);
    let hit = null;
    for (const q of geoQueries(x.place)) {
      try { hit = await photon(q, x.country); } catch { /* try next */ }
      if (hit) break;
      try { hit = await nominatim(q, x.country); } catch { /* try next */ }
      await new Promise((res) => setTimeout(res, 1100));
      if (hit) break;
    }
    if (hit) { try { await S.db.doc("itinerary/" + x.id).update({ lat: hit.lat, lng: hit.lng, geoFor: x.place }); } catch { /* offline */ } }

}
const _render = render;
render = function () { _render(); if (S.view === "itinerary" && S.ready && !S.err) mountMap(); else if (itMap) { try { itMap.remove(); } catch { /* gone */ } itMap = null; } };

/* ---------------------------------------------------------------- start */
(async function start() {
  const h = location.hash.replace("#", "");
  if (["spending", "shopping", "itinerary", "reminders", "memories", "totals"].includes(h)) S.view = h;
  dayPill(); render();
  if (!window.claude?.use) { S.err = "Couldn't open the trip."; render(); return; }
  const [db, assets, user] = await Promise.all([claude.use("db"), claude.use("assets"), claude.use("user")]);
  if (!db) { S.err = "Only Jonna and Migs can open this trip wallet. Sign in with the account it was shared with."; render(); return; }
  S.db = db; S.assets = assets; S.user = user;
  const w = user ? await user.can("data.write") : null;
  S.canWrite = w !== false;
  db.doc("settings/trip").onSnapshot((d) => {
    if (d.exists) {
      const v = d.data();
      if (v.rates) S.rates = { ...S.rates, ...v.rates };
      if (v.shopBudget) S.shopBudget = { ...S.shopBudget, ...v.shopBudget };
      S.trip = { title: v.title || S.trip.title, route: v.route ?? S.trip.route };
    }
    drawTrip();
    if (S.ready && (S.view === "totals" || S.view === "shopping") && !draft && !itDraft && !wdDraft && document.activeElement?.id !== "shop-budget") render();
  }, () => {});
  S.me = user && (await user.isOwner()) ? "jonna" : "migs";
  db.collection("withdrawals").onSnapshot((snap) => {
    S.wd = snap.docs.map((d) => ({ id: d.id, ...d.data() }));
    if (S.ready && S.view === "totals" && !draft && !itDraft && !wdDraft) render();
  }, () => {});
  db.collection("itinerary").onSnapshot((snap) => {
    S.itin = snap.docs.map((d) => ({ id: d.id, ...d.data() }));
    if (S.ready && S.view === "itinerary" && !draft && !itDraft) render();
  }, () => {});
  db.collection("reminders").onSnapshot((snap) => {
    S.reminders = snap.docs.map((d) => ({ id: d.id, ...d.data() }));
    if (S.ready && S.view === "reminders" && !draft && !itDraft && !S.remEdit) {
      const typing = document.activeElement?.id === "rem-new", val = typing ? $("#rem-new").value : "";
      render();
      if (typing) { const i = $("#rem-new"); if (i) { i.value = val; i.focus(); } }
    }
  }, () => {});
  db.collection("expenses").onSnapshot((snap) => {
    S.expenses = snap.docs.map((d) => ({ id: d.id, ...d.data() }));
    S.ready = true;
    if (!draft && !itDraft && !wdDraft) render(); else $("#fab").hidden = true;
  }, (e) => { S.err = e.code === "revoked" ? "Access to this trip wallet changed. Reload to try again." : "Couldn't load your trip. Reload to try again."; render(); });
